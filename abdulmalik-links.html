<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AbdulMalik — Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F3EC;
    --surface: #FFFFFF;
    --ink: #14181D;
    --muted: #6B7280;
    --line: rgba(20,24,29,0.14);
    --grid-dot: rgba(20,24,29,0.10);
    --accent: #A8391F;
    --accent-2: #1C6B57;
    --ring: rgba(168,57,31,0.35);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0A0E13;
      --surface: #131A22;
      --ink: #E9EEF3;
      --muted: #8B97A5;
      --line: rgba(233,238,243,0.14);
      --grid-dot: rgba(233,238,243,0.09);
      --accent: #E58A6C;
      --accent-2: #5FCBAE;
      --ring: rgba(229,138,108,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0A0E13;
    --surface: #131A22;
    --ink: #E9EEF3;
    --muted: #8B97A5;
    --line: rgba(233,238,243,0.14);
    --grid-dot: rgba(233,238,243,0.09);
    --accent: #E58A6C;
    --accent-2: #5FCBAE;
    --ring: rgba(229,138,108,0.35);
  }

  * { box-sizing: border-box; }

  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", "Segoe UI", Tahoma, sans-serif;
    min-height: 100%;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background-image:
      radial-gradient(var(--grid-dot) 1px, transparent 1px);
    background-size: 26px 26px;
    background-position: center;
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: clamp(28px, 7vw, 64px) 20px 40px;
  }

  header.id {
    text-align: center;
    margin-bottom: clamp(28px, 6vw, 44px);
  }

  .id h1 {
    font-size: clamp(1.7rem, 6vw, 2.35rem);
    font-weight: 700;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }

  .id .latin {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    direction: ltr;
    display: inline-block;
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.01em;
    margin-bottom: 14px;
  }

  .id p.tagline {
    color: var(--muted);
    font-size: 0.98rem;
    line-height: 1.75;
    margin: 0 auto;
    max-width: 34ch;
  }

  .stage-wrap {
    margin: 8px auto 6px;
  }

  .stage {
    position: relative;
    width: min(84vw, 400px);
    aspect-ratio: 1 / 1;
    margin: 0 auto;
  }

  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

  .stage svg line {
    stroke: var(--line);
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-dasharray: 70;
    stroke-dashoffset: 70;
    animation: draw 0.9s ease-out forwards;
  }
  .stage svg line.l2 { animation-delay: 0.12s; }
  .stage svg line.l3 { animation-delay: 0.24s; }
  .stage svg line.l4 { animation-delay: 0.36s; }

  @keyframes draw { to { stroke-dashoffset: 0; } }

  .hub {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 27%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--ink);
    color: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "JetBrains Mono", monospace;
    font-weight: 600;
    font-size: clamp(0.85rem, 3vw, 1.05rem);
    letter-spacing: 0.02em;
    opacity: 0;
    animation: pop 0.5s ease-out 0.5s forwards;
  }

  @keyframes pop {
    from { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  .node {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    color: inherit;
    transform: translate(-50%, -50%);
    opacity: 0;
    animation: pop 0.5s ease-out forwards;
    -webkit-tap-highlight-color: transparent;
  }
  .node:nth-of-type(2) { animation-delay: 0.55s; }
  .node:nth-of-type(3) { animation-delay: 0.65s; }
  .node:nth-of-type(4) { animation-delay: 0.75s; }
  .node:nth-of-type(5) { animation-delay: 0.85s; }

  .node .dot {
    width: clamp(52px, 15%, 68px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--surface);
    border: 1.5px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "JetBrains Mono", monospace;
    font-weight: 600;
    font-size: 0.92rem;
    color: var(--ink);
    transition: border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
  }

  .node:hover .dot,
  .node:focus-visible .dot {
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 6px 18px -6px var(--ring);
  }

  .node:focus-visible {
    outline: none;
  }
  .node:focus-visible .dot {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .node .label {
    font-size: 0.8rem;
    color: var(--ink);
    font-weight: 500;
  }
  .node .handle {
    font-family: "JetBrains Mono", monospace;
    direction: ltr;
    font-size: 0.68rem;
    color: var(--muted);
  }

  .hint {
    text-align: center;
    color: var(--muted);
    font-size: 0.82rem;
    margin-top: clamp(18px, 5vw, 30px);
  }

  footer {
    text-align: center;
    margin-top: clamp(36px, 8vw, 56px);
  }
  footer .sig {
    font-family: "JetBrains Mono", monospace;
    direction: ltr;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  @media (prefers-reduced-motion: reduce) {
    .stage svg line { animation: none; stroke-dashoffset: 0; }
    .hub, .node { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
  <div class="wrap">

    <header class="id">
      <h1>AbdulMalik Al-Odailah</h1>
      <span class="latin">IT Student | Cybersecurity</span>
      <p class="tagline">Learning how technology works, and how to protect it.</p>
    </header>

    <div class="stage-wrap">
      <div class="stage">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <line class="l1" x1="50" y1="50" x2="50" y2="20"></line>
          <line class="l2" x1="50" y1="50" x2="82" y2="50"></line>
          <line class="l3" x1="50" y1="50" x2="50" y2="80"></line>
          <line class="l4" x1="50" y1="50" x2="18" y2="50"></line>
        </svg>

        <div class="hub" aria-hidden="true">AM</div>

        <a class="node" style="left:50%; top:20%;" href="https://linkedin.com/in/abdulmalik-al-odailah-bb2700380" target="_blank" rel="noopener noreferrer">
          <span class="dot">in</span>
          <span class="label">LinkedIn</span>
          <span class="handle">linkedin.com</span>
        </a>

        <a class="node" style="left:82%; top:50%;" href="https://x.com/abdulmaliksec?s=11" target="_blank" rel="noopener noreferrer">
          <span class="dot">X</span>
          <span class="label">X</span>
          <span class="handle">x.com</span>
        </a>

        <a class="node" style="left:50%; top:80%;" href="mailto:abdulmalik.alodaila@gmail.com">
          <span class="dot">✉</span>
          <span class="label">Email</span>
          <span class="handle">gmail.com</span>
        </a>

        <a class="node" style="left:18%; top:50%;" href="https://github.com/abdulmalikAlmutairi" target="_blank" rel="noopener noreferrer">
          <span class="dot">gh</span>
          <span class="label">GitHub</span>
          <span class="handle">github.com</span>
        </a>
      </div>
    </div>


  

  </div>
</body>
</html>
